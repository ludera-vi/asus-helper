<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- asusludera: права на системной шине. Менять настройки может только тот, кому разрешил polkit
     (org.asusludera.manage) — это проверяет сам демон. -->
<busconfig>
  <policy user="root">
    <allow own="org.asusludera.Daemon"/>
    <!-- эмуляция power-profiles-daemon для KDE -->
    <allow own="net.hadess.PowerProfiles"/>
    <allow own="org.freedesktop.UPower.PowerProfiles"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.asusludera.Daemon"/>
    <allow send_destination="net.hadess.PowerProfiles"/>
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
  </policy>
</busconfig>
