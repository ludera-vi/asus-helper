# Asus-helper: экран входа SDDM (Xorg) — только на видеокарте, которая ведёт экран. Иначе Xorg подхватывает
# NVIDIA вторым GPU и держит её всю сессию (он остаётся в фоне и после входа): Eco не выключит карту, а когда
# NVIDIA меняет состояние, этот Xorg может упасть — и SDDM вместе с ним закрывает сеанс пользователя.
# Сам Xorg-конфиг — asus-helper-sddm-xorg.conf; он меняет только этот X-сервер, не сеансы пользователя.
[X11]
ServerArguments=-nolisten tcp -config /etc/X11/asus-helper-sddm.conf
