# Asus-helper: KWin (и запускаемый им Xwayland) — только на встроенной видеокарте,
# чтобы NVIDIA можно было выключать (Eco) без выхода из сеанса. Остальные программы это не затрагивает.
[Service]
Environment=KWIN_DRM_DEVICES=/dev/dri/igpu
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
Environment=__GLX_VENDOR_LIBRARY_NAME=mesa
