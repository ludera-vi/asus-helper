# Asus-helper: niri, его Xwayland и то, что он запускает, — OpenGL только встроенной видеокарты, чтобы NVIDIA
# выключалась (Eco) без выхода из сеанса. Что именно — пишет демон в /run/asus-helper/niri.env, и только если
# это безопасно (есть NVIDIA, MUX в гибриде). Нет файла — niri запускается как обычно. Программы на NVIDIA — prime-run.
# Вторая половина — /run/asus-helper/niri.kdl: его подключает в конфиг niri установщик.
[Service]
EnvironmentFile=-/run/asus-helper/niri.env
