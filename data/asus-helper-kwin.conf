# Asus-helper: рабочий стол KDE (KWin и его Xwayland) — только на встроенной видеокарте, чтобы NVIDIA
# выключалась (Eco) без выхода из сеанса. Что именно — пишет демон в /run/asus-helper/kwin.env, и только
# если это безопасно (есть NVIDIA, MUX в гибриде). Нет файла — KWin запускается как обычно.
[Service]
EnvironmentFile=-/run/asus-helper/kwin.env
