# Asus-helper: Xorg экрана входа SDDM (см. sddm.conf.d/asus-helper.conf). Вторые видеокарты (NVIDIA в гибриде)
# не подключаются; основная — та, что ведёт экран, — как обычно, поэтому и в режиме MUX «только NVIDIA»
# экран входа работает. Остальное — из xorg.conf.d, как всегда.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
