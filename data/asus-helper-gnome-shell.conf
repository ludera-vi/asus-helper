# Asus-helper: gnome-shell и его Xwayland — только на встроенной видеокарте (OpenGL без NVIDIA), чтобы она
# выключалась (Eco) без выхода из сеанса. Что именно — пишет демон в /run/asus-helper/gnome.env, и только если
# это безопасно (есть NVIDIA, MUX в гибриде). Нет файла — GNOME запускается как обычно.
[Service]
EnvironmentFile=-/run/asus-helper/gnome.env
